name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Generates the Prisma client into node_modules (gitignored): without it
      # @prisma/client exports no Prisma/PrismaClient types and tsc fails.
      - run: bun run db:generate
      # Generates next-env.d.ts and .next/types (gitignored) required by tsc.
      - run: bunx next typegen
      - run: bunx tsc --noEmit

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    env:
      # The build never connects to a database, but the Prisma client
      # validates its datasource URL at init — provide a valid placeholder.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run build
